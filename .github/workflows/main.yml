name: Deploy React App

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Optional: Forces Node 24 runtime immediately to avoid future deprecation issues
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
    steps:
      - name: Checkout repository
        # Update to v4 or latest
        uses: actions/checkout@v4 

      - name: Setup Node.js
        # Update to v4 or latest, and explicitly set a modern Node version
        uses: actions/setup-node@v4
        with:
          node-version: '24' # or '22' or '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        # Disable CI flag if your build treats warnings as errors
        run: npm run build
        env:
          CI: false 

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist   
